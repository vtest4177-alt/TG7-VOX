name: Build TG VOX iOS IPA

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      release_tag:
        type: string
        required: false
        default: ''
      target_sha:
        type: string
        required: false
        default: ''
  push:
    branches:
      - main
      - master
      - "tgvox*"

concurrency:
  group: tgvox-ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-ipa:
    name: Package TG VOX iOS IPA
    runs-on: macos-15
    timeout-minutes: 60
    permissions:
      contents: write
    env:
      ORG_GRADLE_PROJECT_org.gradle.workers.max: "1"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.target_sha || github.sha }}
          submodules: recursive
          persist-credentials: false

      - name: Free macOS runner disk space for iOS archive
        run: |
          xcrun simctl delete all || true
          rm -rf ~/.rustup ~/.cargo ~/.dotnet /usr/local/share/powershell /usr/local/miniconda 2>/dev/null || true
          if [ -n "${ANDROID_HOME:-}" ]; then
            rm -rf "$ANDROID_HOME/ndk" "$ANDROID_HOME/system-images" "$ANDROID_HOME/emulator" 2>/dev/null || true
          fi
          df -h

      - name: Pre-flight verify iOS bundle & script integrity
        run: |
          bash -n scripts/build_ios.sh
          bash scripts/ios_version.sh
          test -f iosApp/Assets.xcassets/AppIcon.appiconset/AppIcon.png
          grep -E 'PRODUCT_BUNDLE_IDENTIFIER|PRODUCT_NAME' iosApp/Configuration/Config.xcconfig
          grep -E '^bundle_id=' scripts/build_ios.sh

      - name: Prepare CI Gradle
        uses: ./.github/actions/prepare-ci-gradle
        with:
          cache-scope: tgvox-ios-package
          persist-configuration-cache: 'false'

      - name: Sync iOS release version tag
        id: iosver
        run: |
          TAG="${{ inputs.release_tag }}"
          if [ -n "$TAG" ]; then
            VER_NAME="${TAG#v}"
            if [[ "$VER_NAME" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9][A-Za-z0-9._-]*)?$ ]] && grep -q '^appVersion=' gradle.properties; then
              sed -i.bak -E "s/^appVersion=.*/appVersion=$VER_NAME/" gradle.properties
              rm -f gradle.properties.bak
            fi
          fi

      - name: Tune CI iOS memory & strip heavy debug linker flags
        run: |
          if [ -f "shared/build.gradle.kts" ]; then
            sed -i.bak '/-Xadd-light-debug=enable/d' shared/build.gradle.kts
            rm -f shared/build.gradle.kts.bak
          fi
          if [ -f "iosApp/iosApp.xcodeproj/project.pbxproj" ]; then
            sed -i.bak 's/DEBUG_INFORMATION_FORMAT = "dwarf-with-dsym";/DEBUG_INFORMATION_FORMAT = dwarf;/g' iosApp/iosApp.xcodeproj/project.pbxproj
            sed -i.bak 's|./gradlew :shared:embedAndSignAppleFrameworkForXcode|./gradlew :shared:embedAndSignAppleFrameworkForXcode --no-daemon --no-configuration-cache --max-workers=1|g' iosApp/iosApp.xcodeproj/project.pbxproj
            rm -f iosApp/iosApp.xcodeproj/project.pbxproj.bak
          fi
          sed -i.bak \
            -e 's/^org\.gradle\.jvmargs=.*/org.gradle.jvmargs=-Xmx3072m -XX:MaxMetaspaceSize=768m -XX:+UseParallelGC -Dfile.encoding=UTF-8/' \
            -e 's/^org\.gradle\.workers\.max=.*/org.gradle.workers.max=1/' \
            -e 's/^org\.gradle\.parallel=.*/org.gradle.parallel=false/' \
            -e 's/^org\.gradle\.daemon=.*/org.gradle.daemon=false/' \
            gradle.properties
          grep -q '^org\.gradle\.workers\.max=' gradle.properties || echo 'org.gradle.workers.max=1' >> gradle.properties
          grep -q '^org\.gradle\.parallel=' gradle.properties || echo 'org.gradle.parallel=false' >> gradle.properties
          grep -q '^org\.gradle\.daemon=' gradle.properties || echo 'org.gradle.daemon=false' >> gradle.properties
          rm -f gradle.properties.bak
          grep -E 'org\.gradle\.(jvmargs|workers\.max|parallel|daemon)' gradle.properties

      - name: Verify Xcode device SDK
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-path

      - name: Fingerprint Kotlin Native toolchain
        id: native-toolchain
        shell: bash
        run: |
          echo "xcode=$(xcodebuild -version | shasum -a 256 | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"
          echo "kotlin=$(python3 -c 'import tomllib; print(tomllib.load(open("gradle/libs.versions.toml", "rb"))["versions"]["kotlin"])')" >> "$GITHUB_OUTPUT"

      - name: Cache Kotlin Native
        uses: actions/cache@v5
        with:
          path: ~/.konan
          key: konan-tgvox-${{ runner.os }}-${{ runner.arch }}-${{ steps.native-toolchain.outputs.kotlin }}-${{ steps.native-toolchain.outputs.xcode }}

      - name: Compile iOS Kotlin klibs
        run: |
          ./gradlew :shared:compileKotlinIosArm64 --no-daemon --no-configuration-cache --max-workers=1 --stacktrace
          pkill -f GradleDaemon || true
          sudo purge || true

      - name: Tune ultra-lean JVM for LLVM release link
        run: |
          sed -i.bak \
            -e 's/^org\.gradle\.jvmargs=.*/org.gradle.jvmargs=-Xmx1280m -XX:MaxMetaspaceSize=384m -XX:+UseSerialGC -Dfile.encoding=UTF-8/' \
            -e 's/^org\.gradle\.daemon=.*/org.gradle.daemon=false/' \
            gradle.properties
          rm -f gradle.properties.bak
          grep -E 'org\.gradle\.(jvmargs|workers\.max|parallel|daemon)' gradle.properties

      - name: Link iOS release framework
        env:
          CONFIGURATION: Release
        run: |
          ./gradlew :shared:linkReleaseFrameworkIosArm64 --no-daemon --no-configuration-cache --max-workers=1 --stacktrace
          pkill -f GradleDaemon || true
          sudo purge || true

      - name: Build TG VOX IPA
        env:
          CONFIGURATION: Release
        run: |
          bash ./scripts/build_ios.sh --ipa
          if [ -f "dist/Metrolist.ipa" ]; then
            mv "dist/Metrolist.ipa" "dist/TG-VOX-iOS.ipa"
          fi

      - name: Upload TG-VOX iOS IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TG-VOX-iOS-IPA
          path: dist/*.ipa
          if-no-files-found: error
          retention-days: 7

      - name: Attach TG-VOX iOS IPA to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_TAG: ${{ inputs.release_tag }}
        run: |
          TAG="$INPUT_TAG"
          if [ -z "$TAG" ]; then
            TAG=$(gh release list --limit 1 --json tagName -q '.[0].tagName' || true)
          fi
          if [ -z "$TAG" ]; then
            BASE_VER=$(grep -E '^appVersion=' gradle.properties | head -n1 | cut -d= -f2 | tr -d '\r\n' || true)
            [ -z "$BASE_VER" ] && BASE_VER="14.0.1"
            CLEAN_BASE=$(echo "$BASE_VER" | sed -E 's/^v?([0-9]+\.[0-9]+\.[0-9]+).*/\1/')
            IFS='.' read -r MAJ MIN PAT <<< "$CLEAN_BASE"
            TAG="v${MAJ}.${MIN}.$((PAT * 1000 + ${{ github.run_number }}))"
          fi
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" \
              --title "TG VOX $TAG" \
              --notes "Automated TG VOX iOS & Android build synced from upstream Metrolist."
          fi
          gh release upload "$TAG" "dist/TG-VOX-iOS.ipa" --clobber
