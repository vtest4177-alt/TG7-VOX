name: Build TG VOX APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
      - "tgvox*"

jobs:
  build-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build TG VOX (:androidApp:assembleDebug)
        env:
          METROLIST_APPLICATION_ID: com.tgvox.music
          METROLIST_APP_NAME: TG VOX
        run: ./gradlew :androidApp:assembleDebug --no-daemon --stacktrace --warning-mode summary

      - name: Upload TG-VOX APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TG-VOX-APK
          path: "**/build/outputs/apk/**/*.apk"
          if-no-files-found: error
