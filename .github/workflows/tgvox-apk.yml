name: Build TG VOX APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
      - "tgvox*"

jobs:
  build-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Generate release signing keystore
        run: |
          keytool -genkeypair -v -keystore "$RUNNER_TEMP/tgvox-release.jks" \
            -alias tgvox -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass tgvox1234 -keypass tgvox1234 \
            -dname "CN=TG VOX, OU=Personal, O=TGVOX, L=IN, S=IN, C=IN"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build TG VOX (assembleFossRelease)
        env:
          METROLIST_APPLICATION_ID: com.tgvox.music
          METROLIST_APP_NAME: TG VOX
          KEYSTORE_PATH: ${{ runner.temp }}/tgvox-release.jks
          KEYSTORE_PASSWORD: tgvox1234
          KEY_ALIAS: tgvox
          KEY_PASSWORD: tgvox1234
        run: ./gradlew assembleFossRelease --no-daemon --stacktrace --warning-mode summary

      - name: Ensure Release APK is zipaligned and signed
        run: |
          BUILD_TOOLS_DIR=$(find "$ANDROID_HOME/build-tools" -maxdepth 1 -mindepth 1 | sort -V | tail -n 1)
          find . -path "*/build/outputs/apk/*" -name "*-unsigned.apk" | while read -r apk; do
            signed="${apk%-unsigned.apk}-signed.apk"
            "$BUILD_TOOLS_DIR/zipalign" -p -f 4 "$apk" "$signed"
            "$BUILD_TOOLS_DIR/apksigner" sign \
              --ks "$RUNNER_TEMP/tgvox-release.jks" \
              --ks-pass pass:tgvox1234 \
              --key-pass pass:tgvox1234 \
              --ks-key-alias tgvox \
              "$signed"
            rm -f "$apk"
          done

      - name: Upload TG-VOX APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TG-VOX-APK
          path: "**/build/outputs/apk/**/*.apk"
          if-no-files-found: error
