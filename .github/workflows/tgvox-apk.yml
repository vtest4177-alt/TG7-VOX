name: Build TG VOX APK

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      release_tag:
        type: string
        required: false
        default: ''
      target_sha:
        type: string
        required: false
        default: ''
  push:
    branches:
      - main
      - master
      - "tgvox*"
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - '.github/tgvox-upstream-sha'
      - '.github/tgvox-last-sync-at'
      - '.github/workflows/tgvox-auto-sync.yml'

concurrency:
  group: tgvox-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.target_sha || github.sha }}
          submodules: recursive

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Apply full TG VOX branding across all locales
        run: |
          if [ -f ".github/scripts/reapply_tgvox.py" ]; then
            python3 .github/scripts/reapply_tgvox.py
          fi

      - name: Prepare release signing keystore
        env:
          TGVOX_KEYSTORE_BASE64: ${{ secrets.TGVOX_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$TGVOX_KEYSTORE_BASE64" ]; then
            echo "$TGVOX_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/tgvox-release.jks"
            echo "Using fixed persistent TG VOX signing key"
          else
            keytool -genkeypair -v -keystore "$RUNNER_TEMP/tgvox-release.jks" \
              -alias tgvox -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass tgvox1234 -keypass tgvox1234 \
              -dname "CN=TG VOX, OU=Personal, O=TG7 ERROR, L=IN, S=IN, C=IN"
          fi

      - name: Prepare release tag and versionCode for in-place updates
        id: relver
        run: |
          BASE_VER=$(grep -E '^appVersion=' gradle.properties | head -n1 | cut -d= -f2 | tr -d '\r\n' || true)
          [ -z "$BASE_VER" ] && BASE_VER="14.0.1"
          CLEAN_BASE=$(echo "$BASE_VER" | sed -E 's/^v?([0-9]+\.[0-9]+\.[0-9]+).*/\1/')
          IFS='.' read -r MAJ MIN PAT <<< "$CLEAN_BASE"
          TAG="${{ inputs.release_tag }}"
          if [ -z "$TAG" ]; then
            MAX_TAG_PAT=$(git ls-remote --tags origin "refs/tags/v${MAJ}.${MIN}.*" 2>/dev/null | sed -E "s#.*refs/tags/v${MAJ}\.${MIN}\.([0-9]+).*#\1#" | grep -E '^[0-9]+$' | sort -n | tail -n 1 || true)
            CANDIDATE=$((PAT * 1000 + ${{ github.run_number }}))
            if [ -n "$MAX_TAG_PAT" ] && [ "$MAX_TAG_PAT" -ge "$CANDIDATE" ]; then
              FINAL_PAT=$((MAX_TAG_PAT + 1))
            else
              FINAL_PAT=$CANDIDATE
            fi
            TAG="v${MAJ}.${MIN}.${FINAL_PAT}"
          fi
          VER_NAME="${TAG#v}"
          VER_PAT=$(echo "$VER_NAME" | awk -F. '{print $3}')
          [ -z "$VER_PAT" ] && VER_PAT=1
          TARGET_CODE=$((MAJ * 10000000 + MIN * 100000 + VER_PAT))
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version_name=$VER_NAME" >> "$GITHUB_OUTPUT"
          if grep -q '^appVersion=' gradle.properties; then
            sed -i.bak -E "s/^appVersion=.*/appVersion=$VER_NAME/" gradle.properties
            rm -f gradle.properties.bak
          fi
          for gfile in androidApp/build.gradle.kts app/build.gradle.kts; do
            if [ -f "$gfile" ]; then
              python3 -c 'import re,sys;p,r,tc,v=sys.argv[1],int(sys.argv[2]),int(sys.argv[3]),sys.argv[4];s=open(p).read();s=re.sub(r"(versionCode\s*=\s*)(\d+)",lambda m:f"{m.group(1)}{max(int(m.group(2))+r,tc)}",s,count=1);s=re.sub(r"(versionName\s*=\s*\")([^\"]+)(\")",lambda m:f"{m.group(1)}{v}{m.group(3)}",s,count=1);open(p,"w").write(s)' "$gfile" "${{ github.run_number }}" "$TARGET_CODE" "$VER_NAME"
            fi
          done

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build TG VOX (:androidApp:assembleRelease)
        env:
          METROLIST_APPLICATION_ID: com.tgvox.music
          METROLIST_APP_NAME: TG VOX
          KEYSTORE_PATH: ${{ runner.temp }}/tgvox-release.jks
          KEYSTORE_PASSWORD: tgvox1234
          KEY_ALIAS: tgvox
          KEY_PASSWORD: tgvox1234
        run: ./gradlew :androidApp:assembleRelease --no-daemon --stacktrace --warning-mode summary

      - name: Ensure Release APK is zipaligned and signed
        run: |
          BUILD_TOOLS_DIR=$(find "$ANDROID_HOME/build-tools" -maxdepth 1 -mindepth 1 | sort -V | tail -n 1)
          find . -path "*/build/outputs/apk/*" -name "*-unsigned.apk" | while read -r apk; do
            signed="${apk%-unsigned.apk}-signed.apk"
            "$BUILD_TOOLS_DIR/zipalign" -p -f 4 "$apk" "$signed"
            "$BUILD_TOOLS_DIR/apksigner" sign \
              --ks "$RUNNER_TEMP/tgvox-release.jks" \
              --ks-pass pass:tgvox1234 \
              --key-pass pass:tgvox1234 \
              --ks-key-alias tgvox \
              "$signed"
            rm -f "$apk"
          done

      - name: Upload TG-VOX APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TG-VOX-APK
          path: "**/build/outputs/apk/**/*.apk"
          if-no-files-found: error

      - name: Publish TG-VOX APK to GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.relver.outputs.tag }}
          VER_NAME: ${{ steps.relver.outputs.version_name }}
        run: |
          mkdir -p dist
          BUILT_APK=$(find . -path "*/build/outputs/apk/*" -name "*.apk" ! -name "*unsigned*" | head -n 1)
          if [ -z "$BUILT_APK" ]; then
            echo "No signed APK found to publish" >&2
            exit 1
          fi
          cp "$BUILT_APK" "dist/TG-VOX.apk"
          cat > "$RUNNER_TEMP/release-notes.md" << EOF_NOTES
          ## TG VOX v${VER_NAME}

          ### What is New in This Update
          - **Zero-Lag OLED Intro Animation**: Pure #000000 startup sequence with 3 crisp orbiting white dots that swirl and lock into the TG VOX logo & wordmark at smooth 60/120fps.
          - **Complete TG VOX Icon Coverage**: Replaced notification status-bar icon (ic_notification), Android 13+ Material You monochrome icon, and Settings -> Change App Icon picker previews.
          - **Resilient In-App OTA Updater**: 90-second read timeout with 4x HTTP Range-resume retries so updates complete reliably over mobile or Wi-Fi.
          - **Upstream Metrolist Core & Security**: Full R8 release (~14.9 MB) signed with your persistent keystore so playlists, history, and login stay safe on update.
          EOF_NOTES
          sed -i.bak 's/^          //' "$RUNNER_TEMP/release-notes.md" && rm -f "$RUNNER_TEMP/release-notes.md.bak"
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" \
              --title "TG VOX $RELEASE_TAG" \
              --notes-file "$RUNNER_TEMP/release-notes.md"
          else
            gh release edit "$RELEASE_TAG" \
              --title "TG VOX $RELEASE_TAG" \
              --notes-file "$RUNNER_TEMP/release-notes.md"
          fi
          gh release upload "$RELEASE_TAG" "dist/TG-VOX.apk" --clobber
