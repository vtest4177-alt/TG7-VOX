name: Build TG VOX APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
      - "tgvox*"

jobs:
  build-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build TG VOX (assembleGmsDebug)
        env:
          METROLIST_APPLICATION_ID: com.tgvox.music
        run: ./gradlew assembleGmsDebug --no-daemon

      - name: Upload TG-VOX APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TG-VOX-APK
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error
